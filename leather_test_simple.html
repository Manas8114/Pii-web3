<!DOCTYPE html>
<html>
<head>
    <title>🦬 Leather Wallet Test</title>
    <script src="https://unpkg.com/@stacks/connect@latest/dist/connect.umd.js"></script>
</head>
<body style="font-family: Arial; padding: 20px; background: #f0f0f0;">
    <h1>🦬 Leather Wallet Connection Test</h1>
    
    <div style="background: white; padding: 20px; border-radius: 10px; margin: 20px 0;">
        <h3>Status:</h3>
        <div id="status">Checking...</div>
        
        <button id="connectBtn" style="padding: 10px 20px; font-size: 16px; background: #8B4513; color: white; border: none; border-radius: 5px; margin: 10px 0;">
            🔌 Connect Leather
        </button>
    </div>

    <div style="background: white; padding: 20px; border-radius: 10px; margin: 20px 0;">
        <h3>Debug Info:</h3>
        <div id="debug">Loading...</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');
        const connectBtn = document.getElementById('connectBtn');

        function updateStatus(msg) {
            statusDiv.innerHTML = msg;
            console.log(msg);
        }

        function updateDebug(msg) {
            debugDiv.innerHTML += msg + '<br>';
            console.log(msg);
        }

        // Check what's available
        function checkWalletAvailability() {
            updateDebug('=== Wallet Detection ===');
            updateDebug('window.showConnect: ' + (typeof window.showConnect));
            updateDebug('window.UserSession: ' + (typeof window.UserSession));
            updateDebug('window.AppConfig: ' + (typeof window.AppConfig));
            updateDebug('window.StacksProvider: ' + (typeof window.StacksProvider));
            updateDebug('window.LeatherProvider: ' + (typeof window.LeatherProvider));
            updateDebug('window.stacks: ' + (typeof window.stacks));

            if (window.showConnect && window.UserSession) {
                updateStatus('✅ Stacks Connect libraries loaded - Ready to connect');
                connectBtn.disabled = false;
            } else {
                updateStatus('❌ Stacks Connect libraries not loaded');
                connectBtn.textContent = '❌ Libraries Missing';
            }
        }

        // Connect function
        async function connectWallet() {
            try {
                updateStatus('🔌 Connecting to Leather...');
                updateDebug('=== Connection Attempt ===');

                const authOptions = {
                    appDetails: {
                        name: 'Leather Test App',
                        icon: 'https://via.placeholder.com/100'
                    },
                    redirectTo: window.location.href,
                    onFinish: (authData) => {
                        updateDebug('Auth finished successfully!');
                        updateDebug('Auth data: ' + JSON.stringify(authData, null, 2));
                        
                        const userSession = new window.UserSession();
                        if (userSession.isUserSignedIn()) {
                            const userData = userSession.loadUserData();
                            updateDebug('User data: ' + JSON.stringify(userData, null, 2));
                            
                            const address = userData.profile?.stxAddress?.testnet || userData.profile?.stxAddress?.mainnet;
                            if (address) {
                                updateStatus(`🎉 Connected! Address: ${address}`);
                                connectBtn.textContent = '✅ Connected';
                                connectBtn.disabled = true;
                            } else {
                                updateStatus('❌ No address found in user data');
                            }
                        }
                    },
                    onCancel: () => {
                        updateStatus('❌ User cancelled connection');
                        updateDebug('User cancelled the connection');
                    }
                };

                updateDebug('Calling showConnect with options...');
                window.showConnect(authOptions);

            } catch (error) {
                updateStatus('❌ Error: ' + error.message);
                updateDebug('Error details: ' + error.toString());
            }
        }

        // Initialize
        connectBtn.addEventListener('click', connectWallet);
        
        // Wait for libraries to load then check
        setTimeout(() => {
            checkWalletAvailability();
        }, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>🦬 Direct Leather Connection Test</title>
</head>
<body style="font-family: Arial; padding: 20px; background: #f0f0f0;">
    <h1>🦬 Direct Leather Provider Test</h1>
    
    <div style="background: white; padding: 20px; border-radius: 10px; margin: 20px 0;">
        <h3>Status:</h3>
        <div id="status">Checking...</div>
        
        <button id="connectBtn" style="padding: 10px 20px; font-size: 16px; background: #8B4513; color: white; border: none; border-radius: 5px; margin: 10px 0;">
            🔌 Connect Leather (Direct)
        </button>
    </div>

    <div style="background: white; padding: 20px; border-radius: 10px; margin: 20px 0;">
        <h3>Connected Info:</h3>
        <div id="walletInfo">Not connected</div>
    </div>

    <div style="background: white; padding: 20px; border-radius: 10px; margin: 20px 0;">
        <h3>Transactions:</h3>
        <div id="transactions">No transactions loaded</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const walletInfoDiv = document.getElementById('walletInfo');
        const transactionsDiv = document.getElementById('transactions');

        let currentAddress = null;
        const HIRO_API = 'https://api.testnet.hiro.so';

        function updateStatus(msg) {
            statusDiv.innerHTML = msg;
            console.log(msg);
        }

        function updateWalletInfo(msg) {
            walletInfoDiv.innerHTML = msg;
        }

        function updateTransactions(msg) {
            transactionsDiv.innerHTML = msg;
        }

        // Check if Leather is available
        function checkLeatherAvailability() {
            console.log('Checking Leather availability...');
            console.log('window.LeatherProvider:', typeof window.LeatherProvider);
            console.log('window.StacksProvider:', typeof window.StacksProvider);

            if (window.LeatherProvider || window.StacksProvider) {
                updateStatus('✅ Leather detected - Ready to connect');
                connectBtn.disabled = false;
                return true;
            } else {
                updateStatus('❌ Leather not detected - Please install Leather wallet');
                connectBtn.textContent = '📦 Install Leather';
                connectBtn.onclick = () => window.open('https://leather.io', '_blank');
                return false;
            }
        }

        // Connect using direct Leather provider
        async function connectWallet() {
            try {
                updateStatus('🔌 Connecting to Leather...');
                
                // Method 1: Try LeatherProvider
                if (window.LeatherProvider) {
                    console.log('Using LeatherProvider');
                    try {
                        const response = await window.LeatherProvider.request('getAddresses', null);
                        console.log('LeatherProvider response:', response);
                        
                        if (response && response.result && response.result.addresses && response.result.addresses.length > 0) {
                            const address = response.result.addresses[0].address;
                            handleConnectionSuccess(address);
                            return;
                        }
                    } catch (error) {
                        console.log('LeatherProvider failed:', error);
                    }
                }

                // Method 2: Try StacksProvider
                if (window.StacksProvider) {
                    console.log('Trying StacksProvider...');
                    try {
                        // Try to get account info
                        const accountResponse = await window.StacksProvider.getProductInfo();
                        console.log('StacksProvider account info:', accountResponse);
                        
                        // Try to request transaction (this will open Leather)
                        const authResponse = await window.StacksProvider.authenticationRequest();
                        console.log('StacksProvider auth response:', authResponse);
                        
                        if (authResponse && authResponse.address) {
                            handleConnectionSuccess(authResponse.address);
                            return;
                        }
                    } catch (error) {
                        console.log('StacksProvider failed:', error);
                    }
                }

                // Method 3: Manual prompt for address
                const manualAddress = prompt('Leather connection failed. Please enter your Stacks address manually for testing (starts with ST):');
                if (manualAddress && manualAddress.startsWith('ST')) {
                    handleConnectionSuccess(manualAddress);
                    return;
                }

                throw new Error('All connection methods failed');

            } catch (error) {
                updateStatus('❌ Connection failed: ' + error.message);
                console.error('Connection error:', error);
            }
        }

        // Handle successful connection
        function handleConnectionSuccess(address) {
            console.log('Connected successfully with address:', address);
            currentAddress = address;
            
            updateStatus(`✅ Connected!`);
            updateWalletInfo(`
                <strong>Address:</strong> ${address}<br>
                <strong>Network:</strong> Testnet<br>
                <strong>Status:</strong> Connected
            `);
            
            connectBtn.textContent = '✅ Connected';
            connectBtn.disabled = true;
            
            // Load transactions
            loadTransactions(address);
        }

        // Load transactions from Hiro API
        async function loadTransactions(address) {
            try {
                updateTransactions('Loading transactions...');
                
                const url = `${HIRO_API}/extended/v1/address/${address}/transactions?limit=10`;
                console.log('Fetching transactions from:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Transactions response:', data);
                
                if (data.results && data.results.length > 0) {
                    const txHtml = data.results.map(tx => {
                        const type = tx.tx_type || 'unknown';
                        const status = tx.tx_status || 'pending';
                        const time = tx.burn_block_time_iso || 'No time';
                        const txId = tx.tx_id || '';
                        const explorerLink = `https://explorer.hiro.so/txid/${txId}?chain=testnet`;
                        
                        return `
                            <div style="border: 1px solid #ddd; padding: 10px; margin: 5px 0; border-radius: 5px;">
                                <strong>Type:</strong> ${type}<br>
                                <strong>Status:</strong> <span style="color: ${status === 'success' ? 'green' : status === 'pending' ? 'orange' : 'red'}">${status}</span><br>
                                <strong>Time:</strong> ${time}<br>
                                <strong>TX ID:</strong> <a href="${explorerLink}" target="_blank">${txId.substring(0, 20)}...</a>
                            </div>
                        `;
                    }).join('');
                    
                    updateTransactions(`<strong>Found ${data.results.length} transactions:</strong><br><br>${txHtml}`);
                } else {
                    updateTransactions(`
                        <strong>No transactions found</strong><br><br>
                        This address has no transaction history.<br>
                        Try sending some testnet STX from the <a href="https://faucet.hiro.so" target="_blank">Hiro Faucet</a>
                    `);
                }
                
            } catch (error) {
                console.error('Error loading transactions:', error);
                updateTransactions('❌ Failed to load transactions: ' + error.message);
            }
        }

        // Initialize
        connectBtn.addEventListener('click', connectWallet);
        
        // Check availability when page loads
        setTimeout(() => {
            checkLeatherAvailability();
        }, 500);

        // Also run immediately
        checkLeatherAvailability();
    </script>
</body>
</html>
